  <title>全民枪战 · 本地单机</title>
  <style>
    * { box-sizing: border-box; }
    html, body, main, canvas { width: 100%; height: 100%; margin: 0; }
    body { background: #080a0b; color: white; font: 15px/1.45 system-ui, sans-serif; }
    main { position: relative; }
    canvas { display: block; touch-action: none; }
    #status {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      width: min(340px, 85vw); text-align: center; overflow-wrap: anywhere;
    }
    progress { width: 100%; margin-top: 8px; }
    #offline { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
    [hidden] { display: none; }
    #desktop-capture-hint:not([hidden]) { position:absolute; bottom:12%; left:50%; transform:translateX(-50%);
      z-index:2; pointer-events:none; padding:.45em .9em; border-radius:3px; background:#111b; color:#fff;
      white-space:nowrap; font:14px system-ui,sans-serif; }
  </style>
</head>
<body>
  <main>
    <canvas id="unity-canvas" tabindex="0" aria-label="全民枪战"></canvas>
    <section id="original-menu" hidden>
      <div id="original-stage"></div>
      <div id="local-roles" hidden>
        <button type="button" id="switch-role" aria-expanded="false">切换角色</button>
        <div id="role-choices" aria-label="本机角色" hidden></div>
      </div>
    </section>
    <span id="offline" role="status">正在准备离线资源…</span>
    <div id="status" role="status">
      <span id="message">正在加载…</span>
      <progress id="progress" max="1" value="0" aria-label="加载进度"></progress>
    </div>
  </main>
  <script>
    window.qmqzState = (raw) => {
      const detail = typeof raw === "string" ? JSON.parse(raw) : raw;
      window.qmqzLastState = detail;
      window.dispatchEvent(new CustomEvent("qmqz-state", {detail}));
    };
    const statusBox = document.querySelector("#status");
    const progress = document.querySelector("#progress");
    function showError(reason) {
      statusBox.hidden = false;
      progress.hidden = true;
      document.querySelector("#message").textContent = "场景加载失败。" + reason;
    }
    const loader = document.createElement("script");
    loader.src = "Build/Web.loader.js";
    loader.onerror = () => showError("无法读取 Unity 加载器，请刷新重试。");
    loader.onload = async () => {
      try {
        window.qmqzUnity = await createUnityInstance(document.querySelector("#unity-canvas"), {
          arguments: [],
          dataUrl: "Build/Web.data",
          frameworkUrl: "Build/Web.framework.js",
          codeUrl: "Build/Web.wasm",
          streamingAssetsUrl: "StreamingAssets",
          companyName: "DefaultCompany",
          productName: "QMQZ",
          productVersion: "1.0",
          devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
          showBanner(message, type) {
            if (type === "error") showError(message);
            else console.warn(message);
          }
        }, (fraction) => { progress.value = fraction; });
        document.querySelector("#unity-canvas").dataset.unityReady = "true";
        window.dispatchEvent(new Event("qmqz-ready"));
        window.qmqzUnity.SendMessage("WebClient", "Command", "state");
        if (!progress.hidden) statusBox.hidden = true;
      } catch (error) {
        showError(error);
      }
    };
    document.body.appendChild(loader);
  </script>
</body>
</html>
